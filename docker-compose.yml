services:
 ctfd:
  image: ctfd/ctfd:3.8.8
  restart: unless-stopped
  ports:
   - "8000:8000"
  environment:
   - SECRET_KEY=
   - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
   # - REDIS_URL=redis://cache:6379
  volumes:
   - ctfd-data:/var/lib/ctfd
  depends_on:
   - db
  networks:
   - ctfdnet

 db:
  image: mariadb:10.11
  environment:
   - MARIADB_ROOT_PASSWORD=ctfd
   - MARIADB_USER=ctfd
   - MARIADB_PASSWORD=ctfd
   - MARIADB_DATABASE=ctfd
  volumes:
   - db-data:/var/lib/mysql
  networks:
   - ctfdnet

volumes:
 ctfd-data:
 db-data:

networks:
 ctfdnet:
  driver: bridge
